<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payoff Machine: Debt Payoff Planner (Demo)</title>
<style>
/* ============ Payoff Machine | Clear style | compact dashboard ============ */
:root{
  --g:#1e3d2b; --g2:#2e5c42; --bg:#fdf8ee; --card:#ffffff; --tx:#0a0f0b; --mut:#2b2f28;
  --bd:#e3dccb; --ac:#a84e22; --grn:#2e7d5b; --grn2:#7fb069; --grn3:#a8c686; --gold:#c9a227;
  --r:12px; --fs:16px; --pad:12px;
}
[data-theme=dark]{ --grn:#5dd0a0; --bg:#14201a; --card:#1e2f26; --tx:#eef2e9; --mut:#aeb8ad; --bd:#33483c; --g:#16281f; --g2:#22402f; }
*{box-sizing:border-box}
main,.card{min-width:0;max-width:100%}input,select,textarea{max-width:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,Palatino,"Times New Roman",serif;font-size:var(--fs);line-height:1.45}
body.compact{--pad:9px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--grn)}
button.pri{background:var(--g);color:#fff;border-color:var(--g)}
button.acc{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{min-height:36px;padding:5px 10px;border-radius:8px;font-size:.85em}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:9px 10px;background:var(--card);color:var(--tx);width:100%}
input[type=checkbox]{width:auto;min-height:20px}
label{font-size:.85em;color:var(--mut);display:block;margin:8px 0 3px}
h1{font-size:1.55em;margin:0 0 2px}
h2{font-size:1.2em;margin:14px 0 6px}
h3{font-size:1em;margin:0 0 6px}
.desc{color:var(--mut);font-size:.92em;margin:0 0 12px}
a{color:var(--grn)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* layout */
#wrap{display:flex;min-height:100vh}
#side{width:232px;background:var(--g);color:#eef2e9;padding:16px 12px;flex-shrink:0;position:fixed;left:0;top:0;bottom:0;overflow-y:auto}
#side .brand{font-size:1.25em;font-weight:bold;line-height:1.2}
#side .brand small{display:block;font-size:.62em;font-weight:normal;color:#cfe0d2;letter-spacing:.06em;text-transform:uppercase}
#side .grp{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:#a8c686;margin:18px 8px 6px}
#side button.nav{display:block;width:100%;text-align:left;background:transparent;border:0;color:#eef2e9;border-radius:8px;padding:9px 10px;min-height:42px}
#side button.nav:hover,#side button.nav.on{background:rgba(255,255,255,.14)}
#main{flex:1;min-width:0;padding:18px 20px 90px;margin-left:232px}
#top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
#gs{flex:1;min-width:140px}
#menuBtn{display:none}
#top .sp{flex:1}
#top input[type=search]{max-width:none}
#top #gs{flex:1 1 320px;min-width:200px}
#top #qa{margin-left:auto}
.pill{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:4px 11px;font-size:.8em;background:var(--card);color:var(--mut)}
.pill.on{background:var(--g);color:#fff;border-color:var(--g)}
/* cards + tables */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:var(--pad);box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92em}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mut);font-size:.82em;text-transform:uppercase;letter-spacing:.05em}
tr.hl td{background:#fff3cd}
[data-theme=dark] tr.hl td{background:#4a3f10}
.num{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
/* dashboard: compact, screenshot-friendly (image-style density) */
/* Settings page: alternating pastel boxes */
.card.pst1{background:#e4f3ea;border-color:#b9dcc7}
.card.pst2{background:#fdebdc;border-color:#efcbb0}
[data-theme=dark] .card.pst1{background:#1e3a2c;border-color:#2f5a45}
[data-theme=dark] .card.pst2{background:#3a2c22;border-color:#5a4433}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.dash>.card{grid-column:span 4}.dash>.card.st{grid-column:span 3}
.dash .chartbox{height:118px}.dash .donutwrap{max-width:104px}
.dash .card{padding:11px 12px}
.dash .card[data-go]{cursor:pointer}
.dash .card.vc{display:flex;flex-direction:column;justify-content:center}
.dash .card[data-go]:hover{border-color:var(--grn)}
.donutwrap{max-width:120px;margin:0 auto;width:100%}
.hero{background:var(--g);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.hero h1{color:#fff;font-size:2.3em}
.hero .desc{color:#cfe0d2}
.hero .mini{color:#cfe0d2}
.chartbox{height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.chartbox>svg{height:100%;width:auto;max-width:100%}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.dash .ct{font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.dash .big{font-size:1.45em;font-weight:bold;line-height:1.1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.dash .sub{font-size:.82em;color:var(--mut)}
.dash .span2{grid-column:span 2}
.dash .span3{grid-column:span 3}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grn)}
.bar.rust>i{background:var(--ac)}
.bar.gold>i{background:var(--gold)}
.mini{font-size:.82em;color:var(--mut)}
.tag{display:inline-block;background:#eef4ec;border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:.78em}
[data-theme=dark] .tag{background:#24382c}
.notice{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:10px 12px;margin-bottom:12px}
[data-theme=dark] .notice{background:#3a3210;border-color:#6b5a1a}
.taskdone{opacity:.65}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:60;font-size:.92em;display:none;max-width:92vw;text-align:center}
dialog{border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:560px;width:calc(100vw - 32px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#bn{display:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{border:1px solid var(--bd);border-radius:8px;min-height:74px;padding:6px;overflow:hidden;min-width:0;background:var(--card);font-size:.85em}
.cal .d.today{border:2px solid var(--ac)}
.cal .d .n{font-weight:bold}
.cal .d .ev{font-size:.82em;color:var(--grn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1024px){.dash{grid-template-columns:repeat(2,1fr)}.dash>.card,.dash>.card.st{grid-column:auto}.dash .span3{grid-column:span 2}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
  #side{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .2s}
  #side.open{left:0}
  #main{padding:14px 12px 90px;margin-left:0}
  #menuBtn{display:block}
  #top{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  #top #menuBtn{grid-column:1/-1;justify-self:start}
  #top #gs{grid-column:1/-1;min-width:0}
  #top #qa{margin-left:0}
  #top button.sm{min-width:0;padding:4px 2px;font-size:.72em;line-height:1.15;white-space:normal;overflow-wrap:anywhere}
  #bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);z-index:50}
  #bn button{flex:1 1 0;min-width:min-content;border:0;border-radius:0;min-height:56px;padding:4px 1px;font-size:.7em;line-height:1.15;overflow-wrap:normal;word-break:normal;hyphens:none}
  .dash{grid-template-columns:1fr 1fr}.dash .span2,.dash .span3{grid-column:span 2}
  .grid3,.grid2,.grid4{grid-template-columns:minmax(0,1fr)}
  .cal .d{min-height:56px;font-size:.78em}
}
@media(max-width:520px){.dash{grid-template-columns:1fr}.dash .span2,.dash .span3{grid-column:span 1}.secgrid{grid-template-columns:1fr}}
@media print{
  #side,#top,#bn,#toast,.noprint{display:none!important}
  #main{margin-left:0!important;padding:0!important}
  body{background:#fff;color:#000;font-size:12px}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  .dash{grid-template-columns:repeat(3,1fr)}.dash>.card,.dash>.card.st{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ============ DEMO banner ============ */
:root{--bh:44px}
body{padding-top:var(--bh)}
#demoBar{position:fixed;top:0;left:0;right:0;z-index:90;background:var(--ac);color:#fff;display:flex;gap:6px 14px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;padding:9px 14px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;font-weight:700;line-height:1.35;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#demoBar .demoBtn{background:#fff;color:var(--ac);border-radius:99px;padding:3px 12px;font-weight:bold;text-decoration:none}
#side{top:var(--bh)!important}
#wrap{min-height:calc(100vh - var(--bh))}
@media(max-width:800px){#demoBar{font-size:13px;padding:7px 10px}}
@media print{#demoBar{display:none!important}body{padding-top:0}}
</style>
</head>
<body>
<div id="demoBar" role="note">DEMO &mdash; Sample data shown. Try it with sample numbers, then buy the full planner to start with your own numbers.</div>
<div id="wrap">
  <nav id="side" aria-label="Main menu"></nav>
  <main id="main">
    <div id="top">
      <button id="menuBtn" aria-label="Open menu">☰ Menu</button>
      <input type="search" id="gs" placeholder="Search debts, tasks, notes…" aria-label="Global search">
      <button id="qa" class="sm">+ Quick Add</button>
      <button id="th" class="sm" aria-label="Toggle theme">◐ Theme</button>
      <button id="viewTgl" class="sm" aria-label="Toggle Easy or Full view"></button>
      <button id="sampTgl" class="sm" aria-label="Load or clear sample data"></button>
      <button id="pr" class="sm">Print</button>
    </div>
    <div id="view"></div>
    <p class="mini" style="margin-top:28px">Payoff Machine gives estimates only and is not financial, tax or legal advice. See Settings, Important notes, for details.</p>
  </main>
</div>
<nav id="bn" aria-label="Quick menu"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* dialog fallback for browsers/webviews without showModal */
if(typeof HTMLDialogElement!=="undefined"&&!HTMLDialogElement.prototype.showModal){
  HTMLDialogElement.prototype.showModal=function(){this.setAttribute("open","");};
  HTMLDialogElement.prototype.close=function(){this.removeAttribute("open");};}
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=> "x"+Math.random().toString(36).slice(2,9);
const CURR={USD:"$",EUR:"€",GBP:"£",CAD:"$",AUD:"$",PKR:"Rs ",INR:"₹",JPY:"¥",NZD:"$",ZAR:"R "};
const CURRNAMES={USD:"US Dollar",EUR:"Euro",GBP:"British Pound",CAD:"Canadian Dollar",AUD:"Australian Dollar",PKR:"Pakistani Rupee",INR:"Indian Rupee",JPY:"Japanese Yen",NZD:"New Zealand Dollar",ZAR:"South African Rand"};
const SCALE={USD:1,EUR:1,GBP:1,CAD:1,AUD:1,NZD:1,PKR:280,INR:83,JPY:150,ZAR:18};
const sc=()=>SCALE[S.set.cur]||1;
const fmt=n=>{const c=CURR[S.set.cur]||"$";const v=Math.abs(n);const s=v.toLocaleString("en-US",{minimumFractionDigits:S.set.cur==="JPY"?0:2,maximumFractionDigits:S.set.cur==="JPY"?0:2});return (n<0?"-":"")+c+s;};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const parseD=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);};
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addM=(s,n)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dstr(d);};
const monName=s=>parseD(s).toLocaleString("en-US",{month:"short",year:"numeric"});
const fmtD=s=>{if(!s)return "";const d=parseD(s);const dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=d.getFullYear();
  return S.set.df==="dmy"?dd+"/"+mm+"/"+yy:S.set.df==="mdy"?mm+"/"+dd+"/"+yy:yy+"-"+mm+"-"+dd;};
const clockStr=()=>{const d=new Date();let h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0");
  if(S.set.h24)return h+":"+m;const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+m+" "+ap;};
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening";};
const saveT=(()=>{let t;return ()=>{clearTimeout(t);t=setTimeout(save,250);};})();
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",Math.max(3200,m.length*55));}
/* ================= state ================= */
const KEY="payoff-machine-demo-v1"; /* demo uses its own storage key so it never touches a buyer's real planner data */
function defSet(){let th="light";try{if(typeof matchMedia!=="undefined"&&matchMedia("(prefers-color-scheme: dark)").matches)th="dark";}catch(e){}
  return {title:"Payoff Machine",sub:"Debt Payoff Planner",cur:"USD",ac:"#a84e22",grn:"#1e3d2b",fs:16,theme:th,
    strat:"snowball",extra:100,view:"easy",hide:{},names:{},order:[],cats:["General","Card","Loan","Household"],
    hideN:false,helpDone:false,df:"ymd",fdow:"sun",h24:false,dens:"cozy",round:12,cards:{},page:"dash"};}
function sample(){const d=n=>addM(todayStr(),n);
  const o={debts:[
    {id:uid(),name:"Store card",type:"Credit card",bal:340,start:900,apr:24.9,min:25,due:5,ord:0,isSample:true},
    {id:uid(),name:"Credit card",type:"Credit card",bal:2640,start:4200,apr:22.9,min:79,due:12,ord:1,isSample:true},
    {id:uid(),name:"Car loan",type:"Car loan",bal:4180,start:9000,apr:6.5,min:210,due:20,ord:2,isSample:true},
    {id:uid(),name:"Student loan",type:"Student loan",bal:7800,start:12000,apr:5.1,min:120,due:25,ord:3,isSample:true},
    {id:uid(),name:"Dentist bill",type:"Medical",bal:620,start:1000,apr:0,min:50,due:8,ord:4,isSample:true}],
   pay:[{id:uid(),debtId:null,applied:0,date:d(-1),amt:200,note:"Extra payment",isSample:true},
        {id:uid(),debtId:null,applied:0,date:d(-2),amt:79,note:"Minimum",isSample:true},
        {id:uid(),debtId:null,applied:0,date:d(0),amt:50,note:"Payment",isSample:true}],
   tasks:[{id:uid(),title:"Call card company about APR",notes:"Ask for a lower rate",date:todayStr(),time:"",cat:"Card",pri:"High",st:"open",who:"",tags:"",rec:"none",subs:[],isSample:true},
        {id:uid(),title:"Log this month's payments",notes:"",date:todayStr(),time:"",cat:"General",pri:"Medium",st:"open",who:"",tags:"",rec:"none",subs:[],isSample:true},
        {id:uid(),title:"Check balance transfer offer",notes:"Compare fee vs interest saved",date:addM(todayStr(),0),time:"",cat:"Card",pri:"Low",st:"open",who:"",tags:"",rec:"none",subs:[],isSample:true}],
   habits:[{id:uid(),icon:"💳",name:"No-spend day",color:"#2e7d5b",days:[todayStr()],isSample:true},
        {id:uid(),icon:"📝",name:"Log every payment",color:"#a84e22",days:[],isSample:true}],
   goals:[{id:uid(),title:"Pay off the store card",target:900,cur:560,dead:addM(todayStr(),4),miles:"Halfway,Card gone",notes:"Smallest balance first",st:"active",isSample:true},
        {id:uid(),title:"Emergency fund",target:1000,cur:250,dead:addM(todayStr(),8),miles:"Quarter way,Halfway,Fully funded",notes:"So new debt stops here",st:"active",isSample:true}],
   notes:[{id:uid(),text:"Snowball = smallest balance first for quick wins. Avalanche = highest APR first, usually cheapest.",pin:true,color:"green",checks:[],isSample:true},
        {id:uid(),text:"Before a balance transfer, check the fee: a 3% fee on a 2,640 balance is 79.20.",pin:false,color:"cream",checks:[],isSample:true}],
   budget:{inc:3400,bills:1831,spend:650,sf:{inc:true,bills:true,spend:true}},prio:[],focus:null};
  o.pay.forEach((p,i)=>{p.debtId=o.debts[i%o.debts.length].id;});return o;}
function load(){let r=null;
  try{r=localStorage.getItem(KEY);}catch(e){toast("Browser storage is blocked, so changes can't be saved. Use Export backup in Settings.");return {...sample(),set:defSet()};}
  try{if(!r)return {...sample(),set:defSet()};
    const o=JSON.parse(r);const s=defSet();if(o.set&&typeof o.set==="object")Object.assign(s,o.set);
    const out={...sample(),set:s};["debts","pay","tasks","habits","goals","notes"].forEach(k=>{if(Array.isArray(o[k]))out[k]=o[k];});
    if(o.budget&&typeof o.budget==="object")out.budget=o.budget;if(Array.isArray(o.prio))out.prio=o.prio;
    cleanData(out);return out;}catch(e){toast("Saved data was damaged, so a fresh planner opened.");return {...sample(),set:defSet()};}
}
let S=load();
S.pay.forEach((p,i)=>{if(!p.debtId&&S.debts.length)p.debtId=S.debts[i%S.debts.length].id;});
function normalize(){reord();const n=v=>Number.isFinite(+v)?+v:0;(S.debts||[]).forEach(d=>{d.bal=Math.max(0,n(d.bal));d.apr=n(d.apr);d.min=n(d.min);d.due=n(d.due)||1;d.start=Math.max(n(d.start),d.bal);});(S.pay||[]).forEach(p=>{p.amt=n(p.amt)});}
function cleanData(o){const sid=v=>String(v??"").replace(/[^\w-]/g,"");
  const str=(v,d="")=>typeof v==="string"?v:(v==null?d:String(v));
  const num=(v,d=0)=>(v!==""&&v!==null&&Number.isFinite(+v))?+v:d;
  const dOK=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(parseD(v).getTime());
  const list=k=>{o[k]=(Array.isArray(o[k])?o[k]:[]).filter(r=>r&&typeof r==="object"&&!Array.isArray(r));return o[k];};
  const ids=r=>{const seen=new Set();r.forEach(x=>{let i=sid(x.id);if(!i||seen.has(i))i=uid();seen.add(i);x.id=i;x.isSample=!!x.isSample;});};
  const chk=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==="object").map(x=>({t:str(x.t),done:!!x.done}));
  let r=list("debts");ids(r);r.forEach((d,i)=>{d.name=str(d.name,"Debt");d.type=str(d.type,"Other");d.bal=num(d.bal);d.start=num(d.start,d.bal);d.apr=num(d.apr);d.min=num(d.min);d.due=Math.min(28,Math.max(1,Math.round(num(d.due,1))||1));d.ord=num(d.ord,i);});
  r=list("pay");ids(r);r.forEach(p=>{p.debtId=p.debtId==null?null:sid(p.debtId);p.date=dOK(p.date)?p.date:todayStr();p.amt=num(p.amt);p.note=str(p.note);if("applied" in p)p.applied=num(p.applied,p.amt);});
  r=list("tasks");ids(r);r.forEach(t=>{t.title=str(t.title,"Task");t.notes=str(t.notes);t.date=dOK(t.date)?t.date:"";t.time=str(t.time);t.cat=str(t.cat,"General");t.pri=["Low","Medium","High"].includes(t.pri)?t.pri:"Medium";t.st=t.st==="done"?"done":"open";t.who=str(t.who);t.tags=str(t.tags);t.rec=["none","daily","weekly","monthly"].includes(t.rec)?t.rec:"none";t.subs=chk(t.subs);});
  r=list("habits");ids(r);r.forEach(h=>{h.icon=str(h.icon,"✓");h.name=str(h.name,"Routine");h.color=str(h.color,"#2e7d5b");h.days=(Array.isArray(h.days)?h.days:[]).filter(dOK);});
  r=list("goals");ids(r);r.forEach(g=>{g.title=str(g.title,"Goal");g.target=num(g.target);g.cur=num(g.cur);g.dead=dOK(g.dead)?g.dead:"";g.miles=str(g.miles);g.notes=str(g.notes);g.st=g.st==="done"?"done":"active";});

function orderDebts(o){const a=[...S.debts];
  if(o==="snowball")a.sort((x,y)=>x.bal-y.bal);
  else if(o==="avalanche")a.sort((x,y)=>y.apr-x.apr);
  else a.sort((x,y)=>(x.ord??0)-(y.ord??0));
  return a;}
function simCore(ds,extra,order){const a=ds.map(d=>({...d}));
  if(order==="snowball")a.sort((x,y)=>x.bal-y.bal);
  else if(order==="avalanche")a.sort((x,y)=>y.apr-x.apr);
  else a.sort((x,y)=>(x.ord??0)-(y.ord??0));
  const mins=a.reduce((x,d)=>x+(d.bal>0.005||d.start>0.005?d.min:0),0);const budget=mins+Math.max(0,extra);
  let months=0,interest=0;const sched=[];let bal=a.reduce((x,d)=>x+d.bal,0);const paidAt={};
  while(bal>0.005&&months<600){months++;let av=budget;let ipay=0;
    a.forEach(d=>{if(d.bal<=0.005)return;const i=d.bal*d.apr/1200;d.bal+=i;interest+=i;ipay+=i;});
    a.forEach(d=>{if(d.bal<=0.005)return;const p=Math.min(d.min,d.bal,av);d.bal-=p;av-=p;});
    for(const d of a){if(d.bal<=0.005){if(!(d.id in paidAt))paidAt[d.id]=months;continue;}if(av<=0.005)break;const p=Math.min(d.bal,av);d.bal-=p;av-=p;if(d.bal<=0.005)paidAt[d.id]=months;}
    bal=a.reduce((x,d)=>x+d.bal,0);sched.push({m:months,pay:budget-av,int:ipay,bal:Math.max(0,bal)});}
  return {months,interest,ok:bal<=0.005,mins,budget,sched,paidAt,totalPaid:budget*months};}
function sim(extra,order){return simCore(S.debts.map(d=>({...d})),extra,order);}
const totBal=()=>S.debts.reduce((a,d)=>a+d.bal,0);

const dn=id=>{const d=S.debts.find(x=>x.id===id);return d?d.name:"(deleted debt)";};

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Balance falling over time">

function wifCalc(){const base=sim(S.set.extra,S.set.strat);
  /* skip: one month with minimums only, then the normal plan resumes */

  if(so){const ds=orderDebts(S.set.strat).map(d=>({...d}));const mins=ds.reduce((a,d)=>a+(d.bal>0.005||d.start>0.005?d.min:0),0);
    let i1=0;ds.forEach(d=>{const i=d.bal*d.apr/1200;d.bal+=i;i1+=i;});

  /* lump: one-off payment on the first debt in order, then the normal plan */
  const lump=+($("#lumpAmt")?.value||0);const lo=$("#lumpOut");
  if(lo){const ds=orderDebts(S.set.strat).map(d=>({...d}));if(ds.length)ds[0].bal=Math.max(0,ds[0].bal-lump);
    const lr=simCore(ds,S.set.extra,S.set.strat);

function btCalc(){const b=+$("#btBal").value,a=+$("#btApr").value,f=+$("#btFee").value,pa=+$("#btPa").value,pm=+$("#btPm").value,aa=+$("#btAa").value,pay=+$("#btPay").value;
  if(!b||!pay){$("#btOut").innerHTML="<p class='mini'>Enter a balance and a monthly payment.</p>";return;}
  const run=(bal,promo)=>{let m=0,i=0;while(bal>0.005&&m<600){m++;const apr=promo?(m<=pm?pa:aa):a;const it=bal*apr/1200;bal+=it;i+=it;bal-=Math.min(bal,pay);}return {months:m,interest:i,ok:bal<=0.005};};
  const s=run(b,false),t=run(b*(1+f/100),true);const fee=b*f/100;const tc=t.interest+fee;
  const num=(v,ok)=>ok?fmt(v):"—";
  let verdict;
  if(!s.ok&&!t.ok)verdict="Neither option clears: your monthly payment is too low to cover the interest. Raise the payment and compare again.";
  else if(!s.ok)verdict="Transferring clears the balance but staying put does not at this payment. Transfer looks better, but confirm the real terms.";
  else if(!t.ok)verdict="Staying put clears the balance but transferring does not at this payment. Skip it.";
  else verdict=tc<s.interest?("Transfer saves about "+fmt(s.interest-tc)):("Transfer costs about "+fmt(tc-s.interest)+" more — skip it.");
  $("#btOut").innerHTML=`<p>Staying put: <b class="num">${num(s.interest,s.ok)}</b> interest, ${s.ok?s.months+" months":"does not clear"}.</p>
  <p>Transferring: fee <b class="num">${fmt(fee)}</b> + interest <b class="num">${num(t.interest,t.ok)}</b> = <b class="num">${num(tc,t.ok)}</b> total, ${t.ok?t.months+" months":"does not clear"}.</p>
  <p><b>${esc(verdict)}</b></p>`;}

    else if(f.t==="area"){h+=`<label>${esc(f.l)}</label><textarea name="${f.k}" rows="3">${esc(f.v||"")}</textarea>`;}
    else if(f.t==="check"){h+=`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${f.k}" ${f.v?"checked":""}> ${esc(f.l)}</label>`;}
    else{h+=`<label>${esc(f.l)}</label><input type="${f.t==="num"?"number":f.t}" name="${f.k}" value="${esc(f.v??"")}" ${f.req?"required":""} ${f.min!==undefined?`min="${f.min}"`:""} ${f.max!==undefined?`max="${f.max}"`:""} ${f.t==="num"?'step="any"':""}>`;}});
  h+=`<p id="fErr" class="mini" style="color:var(--ac)"></p><div class="row" style="margin-top:12px"><button type="submit" class="pri">Save</button><button type="button" id="fCancel">Cancel</button></div></form>`;
  d.innerHTML=h;fixLabels(d);d.showModal();const f0=d.querySelector("input,select,textarea");if(f0)f0.focus();
  $("#fCancel").onclick=()=>d.close();
  $("#fForm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const vals={};
    fields.forEach(f=>{if(f.t==="check")vals[f.k]=fd.get(f.k)?1:0;else vals[f.k]=fd.get(f.k)??"";});
    for(const f of fields){if(f.req&&String(vals[f.k]).trim()===""){$("#fErr").textContent="Please fill: "+f.l;return;}
      if(f.t==="num"&&vals[f.k]!==""&&(isNaN(+vals[f.k])||(f.min!==undefined&&+vals[f.k]<f.min)||(f.max!==undefined&&+vals[f.k]>f.max))){$("#fErr").textContent="Check the number for: "+f.l;return;}
      if(f.t==="date"&&vals[f.k]&&isNaN(parseD(vals[f.k]).getTime())){$("#fErr").textContent="Check the date for: "+f.l;return;}}
    const err=cb(vals);if(typeof err==="string"&&err){$("#fErr").textContent=err;return;}d.close();};}
function confirmBox(msg,okFn){const d=$("#dlg");
  d.innerHTML=`<h2 style="margin-top:0">Are you sure?</h2><p>${esc(msg)}</p><div class="row"><button class="pri" id="cfY">Yes</button><button id="cfN">Cancel</button></div>`;
  d.showModal();$("#cfY").onclick=()=>{d.close();okFn();};$("#cfN").onclick=()=>d.close();}
/* ================= undo + delete ================= */
let undoRec=null;
function undoPush(kind,data){undoRec={kind,...data};}
function doUndo(){if(!undoRec){toast("Nothing to undo.");return;}
  const u=undoRec;undoRec=null;
  if(u.kind==="del"){S[u.coll].splice(Math.min(u.idx,S[u.coll].length),0,u.rec);
    if(u.coll==="pay"){const t=S.debts.find(x=>x.id===u.rec.debtId);if(t)t.bal=Math.max(0,t.bal-(u.rec.applied??u.rec.amt));}}
  else if(u.kind==="task"){const t=S.tasks.find(x=>x.id===u.id);if(t)t.st=u.prev;if(u.spawn)S.tasks=S.tasks.filter(x=>x.id!==u.spawn);}
  else if(u.kind==="paydel"){S.pay.push(u.rec);const t=S.debts.find(x=>x.id===u.rec.debtId);if(t)t.bal=Math.max(0,t.bal-(u.rec.applied??u.rec.amt));}
  saveT();render();toast("Undone.");}
function delRec(coll,id){const arr=S[coll];const idx=arr.findIndex(x=>x.id===id);if(idx<0)return;
  const rec=arr[idx];
  confirmBox(`Delete "${rec.name||rec.title||""}"? This cannot be undone except with Ctrl+Z right away.`,()=>{
    arr.splice(idx,1);undoPush("del",{coll,rec,idx});
    if(coll==="tasks")S.prio=S.prio.filter(x=>x!==id);
    saveT();render();toast("Deleted. Press Ctrl+Z to undo.");});}
function delPay(id){const idx=S.pay.findIndex(x=>x.id===id);if(idx<0)return;const rec=S.pay[idx];
  confirmBox(`Delete this ${fmt(rec.amt)} payment? The amount goes back onto the debt.`,()=>{
    S.pay.splice(idx,1);const t=S.debts.find(x=>x.id===rec.debtId);if(t)t.bal+=(rec.applied??rec.amt);
    undoPush("paydel",{rec});saveT();render();toast("Payment deleted and balance restored.");});}

function download(name,text,type){const b=new Blob([text],{type:type||"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function csvCell(v){let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function parseCSV(text){const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else if(c!=="\r")cur+=c;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));}
function validateImport(o){if(!o||typeof o!=="object"||Array.isArray(o))return {ok:false,why:"File is not a planner backup object."};
  for(const k of ["debts","pay","tasks","habits","goals","notes"]){if(k in o&&!Array.isArray(o[k]))return {ok:false,why:"Section "+k+" is not a list."};
    if(k in o&&o[k].some(x=>!x||typeof x!=="object"||Array.isArray(x)))return {ok:false,why:"Section "+k+" contains an item that is not a record."};}
  if(o.debts)for(const d of o.debts){if(typeof d.name!=="string"||!isFinite(+d.bal))return {ok:false,why:"A debt is missing a name or a valid balance."};}
  const counts={};["debts","pay","tasks","habits","goals","notes"].forEach(k=>counts[k]=Array.isArray(o[k])?o[k].length:0);
  return {ok:true,counts};}

function searchDlg(){const q=$("#gs").value.trim().toLowerCase();if(!q){toast("Type something to search.");return;}
  const res=[];
  S.debts.forEach(d=>{if((d.name+" "+d.type).toLowerCase().includes(q))res.push({t:"Debt",x:d.name,p:"debts",id:d.id});});
  S.pay.forEach(p=>{if((dn(p.debtId)+" "+(p.note||"")).toLowerCase().includes(q))res.push({t:"Payment",x:dn(p.debtId)+" · "+fmt(p.amt),p:"pay",id:p.id});});
  S.tasks.forEach(t=>{if((t.title+" "+(t.notes||"")).toLowerCase().includes(q))res.push({t:"Task",x:t.title,p:"tasks",id:t.id});});
  S.notes.forEach(n=>{if(n.text.toLowerCase().includes(q))res.push({t:"Note",x:n.text.slice(0,60),p:"notes",id:n.id});});
  S.goals.forEach(g=>{if(g.title.toLowerCase().includes(q))res.push({t:"Goal",x:g.title,p:"goals",id:g.id});});
  S.habits.forEach(h=>{if(h.name.toLowerCase().includes(q))res.push({t:"Routine",x:h.name,p:"habits",id:h.id});});
  const d=$("#dlg");
  d.innerHTML=`<h2 style="margin-top:0">Search results</h2>${res.length?res.map(r=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span><span class="tag">${r.t}</span> ${esc(r.x)}</span><button class="sm" data-search-go="${r.p}|${r.id}">Open</button></div>`).join(""):"<p class='mini'>Nothing found.</p>"}<div class="row" style="margin-top:12px"><button id="fCancel">Close</button></div>`;
  d.showModal();$("#fCancel").onclick=()=>d.close();
  d.querySelectorAll("[data-search-go]").forEach(b=>b.onclick=()=>{const [p,id]=b.dataset.searchGo.split("|");d.close();S.focus=id;go(p);});}

function filterDebts(){const q=($("#debtF")?.value||"").toLowerCase();const ty=$("#debtT")?.value||"";
  $$("#debtRows tr").forEach(tr=>{const cells=tr.querySelectorAll("td");const okQ=!q||[...cells].slice(0,-1).map(c=>c.textContent).join(" ").toLowerCase().includes(q);const okT=!ty||(cells[1]&&cells[1].textContent===ty);tr.style.display=(okQ&&okT)?"":"none";});}
function viewClick(e){const b=e.target.closest("button");
  if(!b){const gEl=e.target.closest("[data-go]");if(gEl)go(gEl.dataset.go);return;}
  if(b.dataset.p){go(b.dataset.p);return;}
  if(b.id==="calPrev"&&calView==="week"){calWeekOff--;render();return;}
  if(b.id==="calNext"&&calView==="week"){calWeekOff++;render();return;}
  if(b.id==="calPrev"){calCur.m--;if(calCur.m<0){calCur.m=11;calCur.y--;}render();return;}
  if(b.id==="calToday"){calWeekOff=0;const n=new Date();calCur={y:n.getFullYear(),m:n.getMonth()};render();return;}
  if(b.id==="calNext"){calCur.m++;if(calCur.m>11){calCur.m=0;calCur.y++;}render();return;}
  if(b.id==="addDebt")return debtForm(null);
  if(b.id==="addPay")return payForm(null);
  if(b.id==="addTask")return taskForm(null);
  if(b.id==="addHabit")return habitForm(null);
  if(b.id==="addGoal")return goalForm(null);
  if(b.id==="addNote")return noteForm(null);
  if(b.dataset.log)return payForm(null,b.dataset.log);
  if(b.dataset.editDebt){const d=S.debts.find(x=>x.id===b.dataset.editDebt);if(d)debtForm(d);return;}
  if(b.dataset.dupDebt){const d=S.debts.find(x=>x.id===b.dataset.dupDebt);if(d){S.debts.push({...d,id:uid(),name:d.name+" (copy)",ord:(d.ord??0)+0.5,isSample:false});reord();saveT();render();toast("Debt duplicated.");}return;}
  if(b.dataset.del){const [c,id]=b.dataset.del.split("|");delRec(c,id);return;}
  if(b.dataset.delPay)return delPay(b.dataset.delPay);
  if(b.dataset.editPay){const p=S.pay.find(x=>x.id===b.dataset.editPay);if(p)payForm(p);return;}
  if(b.dataset.editTask){const t=S.tasks.find(x=>x.id===b.dataset.editTask);if(t)taskForm(t);return;}
  if(b.dataset.dupTask){const t=S.tasks.find(x=>x.id===b.dataset.dupTask);if(t){S.tasks.push({...t,id:uid(),title:t.title+" (copy)",subs:t.subs.map(s=>({...s})),isSample:false});saveT();render();toast("Task duplicated.");}return;}
  if(b.dataset.star){const id=b.dataset.star;if(S.prio.includes(id))S.prio=S.prio.filter(x=>x!==id);else S.prio.push(id);saveT();render();return;}
  if(b.dataset.editHabit){const h=S.habits.find(x=>x.id===b.dataset.editHabit);if(h)habitForm(h);return;}
  if(b.dataset.dupHabit){const h=S.habits.find(x=>x.id===b.dataset.dupHabit);if(h){S.habits.push({...h,id:uid(),days:[],isSample:false});saveT();render();toast("Routine duplicated.");}return;}
  if(b.dataset.editGoal){const g=S.goals.find(x=>x.id===b.dataset.editGoal);if(g)goalForm(g);return;}
  if(b.dataset.goalAdd){const g=S.goals.find(x=>x.id===b.dataset.goalAdd);if(!g)return;
    openForm("Add progress",[{k:"amt",l:"Amount to add",t:"num",v:"",req:1,min:0}],vals=>{g.cur+=+vals.amt;if(g.cur>=g.target)g.st="done";saveT();render();toast("Progress added.");});return;}
  if(b.dataset.goalDone){const g=S.goals.find(x=>x.id===b.dataset.goalDone);if(g){g.st="done";saveT();render();toast("Goal done.");}return;}
  if(b.dataset.pinNote){const n=S.notes.find(x=>x.id===b.dataset.pinNote);if(n){n.pin=!n.pin;saveT();render();}return;}
  if(b.dataset.editNote){const n=S.notes.find(x=>x.id===b.dataset.editNote);if(n)noteForm(n);return;}
  if(b.dataset.dupNote){const n=S.notes.find(x=>x.id===b.dataset.dupNote);if(n){S.notes.push({...n,id:uid(),checks:n.checks.map(c=>({...c})),isSample:false});saveT();render();toast("Note duplicated.");}return;}
  if(b.dataset.ordUp||b.dataset.ordDn){reord();const id=b.dataset.ordUp||b.dataset.ordDn;const arr=[...S.debts].sort((x,y)=>(x.ord??0)-(y.ord??0));const i=arr.findIndex(x=>x.id===id);const j=b.dataset.ordUp?i-1:i+1;
    if(i<0||j<0||j>=arr.length)return;const tmp=arr[i].ord;arr[i].ord=arr[j].ord;arr[j].ord=tmp;saveT();render();return;}
  if(b.dataset.prioUp||b.dataset.prioDn||b.dataset.prioRm){const id=b.dataset.prioUp||b.dataset.prioDn||b.dataset.prioRm;
    if(b.dataset.prioRm){S.prio=S.prio.filter(x=>x!==id);}
    else{const i=S.prio.indexOf(id);const j=b.dataset.prioUp?i-1:i+1;if(i<0||j<0||j>=S.prio.length)return;const t=S.prio[i];S.prio[i]=S.prio[j];S.prio[j]=t;}
    saveT();render();return;}
  if(b.dataset.rep){repRange=b.dataset.rep;render();return;}
  if(b.id==="repGo")return render();
  if(b.id==="repCsv"){let from,to;const t=new Date();
    if(repRange==="7"){to=todayStr();const d=new Date();d.setDate(d.getDate()-6);from=dstr(d);}
    else if(repRange==="month"){from=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-01";to=todayStr();}
    else if(repRange==="custom"){from=$("#repFrom")?.value||todayStr();to=$("#repTo")?.value||todayStr();}
    else{to=todayStr();const d=new Date();d.setDate(d.getDate()-29);from=dstr(d);}
    const rows=S.pay.filter(p=>p.date>=from&&p.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
    download(`debt-payments-${from}-to-${to}.csv`,["Date,Debt,Amount,Note"].concat(rows.map(p=>[p.date,dn(p.debtId),p.amt,p.note||""].map(csvCell).join(","))).join("\n"),"text/csv");toast("Range exported as CSV.");return;}
  if(b.id==="bulkDone"){const ids=$$(".bulk:checked").map(x=>x.value);if(!ids.length){toast("Tick some tasks first.");return;}
    ids.forEach(id=>{const t=S.tasks.find(x=>x.id===id);if(t&&t.st!=="done")completeTask(t);});saveT();render();toast(ids.length+" tasks completed.");return;}
  if(b.id==="useLeft"){const mins=liveMins();const left=Math.max(0,(S.budget.inc||0)-(S.budget.bills||0)-(S.budget.spend||0)-mins);S.set.extra=left;saveT();render();toast("Extra payment set to "+fmt(left)+".");return;}
  if(b.id==="btGo")return btCalc();
  if(b.id==="helpX"){S.set.helpDone=true;saveT();render();return;}
  if(b.id==="expJson"){download(`payoff-machine-backup-${todayStr()}.json`,JSON.stringify(S,null,2),"application/json");toast("Backup exported.");return;}
  if(b.id==="expDebtCsv"){download("payoff-machine-debts.csv",["Name,Type,Balance,Starting balance,APR,Minimum,Due day"].concat(S.debts.map(d=>[d.name,d.type,d.bal,d.start,d.apr,d.min,d.due].map(csvCell).join(","))).join("\n"),"text/csv");return;}
  if(b.id==="expPayCsv"){download("payoff-machine-payments.csv",["Date,Debt,Amount,Note"].concat(S.pay.map(p=>[p.date,dn(p.debtId),p.amt,p.note||""].map(csvCell).join(","))).join("\n"),"text/csv");return;}
  if(b.id==="clrS2")return clearSample();
  if(b.id==="loadS2")return loadSample();
  if(b.id==="resetPlanner"){openForm("Reset planner",[{k:"confirm",l:"Type RESET to confirm — this erases all records",t:"text",v:""}],vals=>{if(vals.confirm.trim()!=="RESET")return "Type RESET exactly.";
    setTimeout(()=>confirmBox("Are you sure? All your debts, payments, tasks, routines, goals, notes and settings will be deleted and the sample data will load again. This cannot be undone.",()=>{
      S={...sample(),set:defSet(),page:"dash"};save();render();toast("Planner reset. Sample data is loaded again: clear it from the top bar.");}),0);});return;}
}
function viewChange(e){const el=e.target,id=el.id;
  if(id==="stSel"){S.set.strat=el.value;saveT();render();return;}
  if(id==="exInp"){S.set.extra=Math.max(0,+el.value||0);saveT();render();return;}
  if(id==="calViewSel"){calView=el.value;render();return;}
  if(id==="bInc"){S.budget.inc=+el.value||0;S.budget.sf.inc=false;saveT();render();return;}
  if(id==="bBills"){S.budget.bills=+el.value||0;S.budget.sf.bills=false;saveT();render();return;}
  if(id==="bSpend"){S.budget.spend=+el.value||0;S.budget.sf.spend=false;saveT();render();return;}
  if(id==="taskFl"||id==="taskSo"){render();return;}
  if(id==="payF"){$$("#view tbody tr").forEach(tr=>{tr.style.display=(!el.value||tr.dataset.debt===el.value)?"":"none";});return;}
  if(id==="debtT"){filterDebts();return;}
  if(el.dataset.done){toggleTask(el.dataset.done);return;}
  if(el.dataset.sub){const [tid,i]=el.dataset.sub.split("|");const t=S.tasks.find(x=>x.id===tid);if(t&&t.subs[i])t.subs[i].done=el.checked;saveT();return;}
  if(el.dataset.ncheck){const [nid,i]=el.dataset.ncheck.split("|");const n=S.notes.find(x=>x.id===nid);if(n&&n.checks[i])n.checks[i].done=el.checked;saveT();return;}
  if(el.dataset.habit){const h=S.habits.find(x=>x.id===el.dataset.habit);if(!h)return;const t=todayStr();
    if(h.days.includes(t))h.days=h.days.filter(d=>d!==t);else h.days.push(t);saveT();render();return;}
  if(id==="setCur"){S.set.cur=(el.value.split(" — ")[0]||"USD");saveT();render();return;}
  if(id==="impDebtCsv"){const f=el.files[0];if(!f)return;if(f.size>2*1024*1024){toast("File is over 2 MB.");return;}
    const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result);
      if(!rows.length){toast("No rows found in this CSV.");return;}
      let start=0,idx={name:0,type:1,bal:2,start:3,apr:4,min:5,due:6};
      const h0=rows[0].map(c=>String(c).toLowerCase());
      if(h0.some(c=>/name/.test(c))){start=1;const find=re=>h0.findIndex(c=>re.test(c));
        const F=(re,def,not)=>{const i=h0.findIndex(c=>re.test(c)&&!(not&&not.test(c)));return i>=0?i:def;};
        idx={name:F(/name/,0),type:F(/type|kind/,-1),bal:F(/balance|owed|amount/,2,/start|original/),start:F(/start|original/,-1),apr:F(/apr|rate|interest/,-1),min:F(/min/,-1),due:F(/due|day/,-1)};}
      const good=[];let bad=0;const reasons=[];
      for(let r=start;r<rows.length;r++){const cols=rows[r];const name=(cols[idx.name]||"").trim();const bal=+cols[idx.bal];
        const aprV=(cols[idx.apr]||"").trim()===""?0:+cols[idx.apr];const minV=+cols[idx.min];
        let why="";
        if(!name)why="no name";
        else if(!isFinite(bal)||(cols[idx.bal]||"").trim()==="")why="balance is not a number";
        else if(bal<0)why="negative balance";
        else if(!isFinite(aprV)||aprV<0||aprV>100)why="APR must be 0 to 100";
        else if(!isFinite(minV)||(cols[idx.min]||"").trim()===""||minV<1)why="minimum must be at least 1";
        if(why){bad++;if(reasons.length<3)reasons.push("row "+(r+1)+": "+why);continue;}
        good.push({id:uid(),name,type:(cols[idx.type]||"").trim()||"Other",bal,start:isFinite(+cols[idx.start])?+cols[idx.start]:bal,apr:isFinite(+cols[idx.apr])?+cols[idx.apr]:0,min:isFinite(+cols[idx.min])?+cols[idx.min]:0,due:Math.min(28,Math.max(1,Math.round(+cols[idx.due])||1)),ord:S.debts.length+good.length,isSample:false});}
      if(!good.length){toast("No valid debts found"+(reasons.length?": "+reasons.join("; "):" in this CSV")+".");return;}
      confirmBox(`Add ${good.length} debt${good.length>1?"s":""} from this CSV?${bad?` (${bad} row${bad>1?"s":""} skipped — ${reasons.join("; ")}${bad>reasons.length?"; …":""}.)`:""}`,()=>{
        good.forEach(d=>S.debts.push(d));saveT();render();toast(good.length+" debt"+(good.length>1?"s":"")+" imported.");});};
    rd.readAsText(f);return;}
  if(id==="impFile"){const f=el.files[0];if(!f)return;if(f.size>2*1024*1024){toast("File is over 2 MB.");return;}
    const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const v=validateImport(o);
      if(!v.ok){toast("Import rejected: "+v.why);return;}
      confirmBox(`Import ${Object.entries(v.counts).map(([k,c])=>c+" "+k).join(", ")}? This replaces your current data.`,()=>{
        ["debts","pay","tasks","habits","goals","notes"].forEach(k=>{if(Array.isArray(o[k]))S[k]=o[k];});
        if(o.budget&&typeof o.budget==="object")S.budget=o.budget;if(Array.isArray(o.prio))S.prio=o.prio;
        if(o.set&&typeof o.set==="object"){const s=defSet();Object.assign(s,o.set);S.set=s;}
        cleanData(S);save();render();toast("Backup imported.");});}catch(err){toast("Import failed: file is not valid JSON.");}};
    rd.readAsText(f);return;}}
function viewInput(e){const el=e.target;
  if(el.id==="skipAmt"||el.id==="lumpAmt"||el.id==="tgtDate")wifCalc();
  if(el.id==="debtF")filterDebts();
  if(el.id==="taskF"){const q=el.value.toLowerCase();$$("#view .card").forEach(c=>{c.style.display=cardText(c).includes(q)?"":"none";});}
  if(el.id==="noteF"){const q=el.value.toLowerCase();$$("#view .card").forEach(c=>{c.style.display=cardText(c).includes(q)?"":"none";});}}
function bind(){if(S.page==="wif")wifCalc();}
/* ================= top bar, shortcuts, init ================= */
$("#th").onclick=()=>{S.set.theme=S.set.theme==="dark"?"light":"dark";saveT();render();};
$("#viewTgl").onclick=()=>{S.set.view=S.set.view==="easy"?"full":"easy";if(S.set.view==="easy"){const pg=PAGES.find(x=>x.id===S.page);if(pg&&!pg.easy)S.page="dash";}saveT();render();};
$("#sampTgl").onclick=()=>{const has=["debts","pay","tasks","habits","goals","notes"].some(k=>S[k].some(x=>x.isSample));if(has)clearSample();else loadSample();};

  <button data-qa="habit">Routine</button><button data-qa="goal">Goal</button><button data-qa="note">Note</button></div>
  <div class="row" style="margin-top:12px"><button id="fCancel">Close</button></div>`;
  d.showModal();$("#fCancel").onclick=()=>d.close();

    ({debt:()=>debtForm(null),pay:()=>payForm(null),task:()=>taskForm(null),habit:()=>habitForm(null),goal:()=>goalForm(null),note:()=>noteForm(null)})[b.dataset.qa]();});};
$("#pr").onclick=()=>printPanel();
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
$("#gs").addEventListener("keydown",e=>{if(e.key==="Enter")searchDlg();});
$("#bn").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.p)go(b.dataset.p);if(b.id==="bnMore")$("#side").classList.add("open");});
$("#side").addEventListener("click",e=>{const b=e.target.closest("button[data-p]");if(b)go(b.dataset.p);});
$("#view").addEventListener("click",viewClick);
$("#view").addEventListener("change",viewChange);
$("#view").addEventListener("input",viewInput);
$("#view").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-go]")){e.preventDefault();go(e.target.dataset.go);}});
document.addEventListener("keydown",e=>{
  const ae=document.activeElement;const inF=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();
    if(k==="s"){e.preventDefault();save();toast("Saved.");}
    else if(k==="p"){e.preventDefault();printPanel();}
    else if(k==="z"&&!inF){e.preventDefault();doUndo();}
    return;}
  if(inF)return;
  if(e.key==="/"){e.preventDefault();$("#gs").focus();}
  if(e.key==="n"){if(document.querySelector("dialog[open]"))return;e.preventDefault();$("#qa").click();}});
setInterval(()=>{const c=$("#clockTxt");if(c)c.textContent=clockStr();},1000);
if(!visiblePages().some(p=>p.id===S.set.page))S.page="dash";else S.page=S.set.page;
render();
